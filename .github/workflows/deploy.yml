name: Deploy

# Ships a commit that has passed CI on `prod` to the server. GitHub holds no key to the server: it signs in to AWS
# with a short-lived token (OIDC), and the role it gets may do exactly one thing, run the SSM document
# `autoca-deploy`, which takes only a commit id and runs deploy/deploy.sh with it. See docs/AWS.md.
#
#   promote:  git push origin dev:main && git push origin dev:prod      (CI runs, then this does)
#   by hand:  Actions -> Deploy -> Run workflow, with "Use workflow from" set to prod.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [prod]
  workflow_dispatch:

# One deploy at a time; a second waits for the first rather than cancelling it halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::000246635189:role/autoca-github-deploy
  INSTANCE_ID: i-042e3587af280cb66
  DOCUMENT: autoca-deploy

jobs:
  deploy:
    name: Deploy to the server
    runs-on: ubuntu-latest
    # Only a green CI run on prod, or a person pressing the button on prod.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod')
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the deploy on the server
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          echo "Deploying $COMMIT"
          id="$(aws ssm send-command \
            --document-name "$DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "commit=$COMMIT" \
            --comment "GitHub deploy ${COMMIT}" \
            --query Command.CommandId --output text)"
          echo "SSM command $id"

          # Wait for it, up to 25 minutes (a rebuild takes a few).
          status=Pending
          for _ in $(seq 1 150); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          out="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text)"
          echo "---- server output (the last 60 lines) ----"
          echo "$out" | tail -60
          echo "-------------------------------------------"
          echo "Final status: $status"
          [ "$status" = "Success" ]
