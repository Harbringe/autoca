# Production on one AWS instance: the app, its database, redis, and Caddy serving the web app over HTTPS.
#
#   deploy/init-env.sh app.example.in api.example.in my-bucket   # writes .env.prod, .env.owner, .env.db
#   docker compose --env-file .env.prod -f compose.prod.yaml build
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d
#
# Three env files, so each container receives only the credentials it needs (deploy/init-env.sh writes them):
#   .env.prod   the app's settings: read by web and migrate. Holds the app role's login, nothing that can
#               change the schema or bypass row-level security. --env-file reads APP_HOST and API_HOST from
#               it for Caddy.
#   .env.owner  the owner role's login: read by migrate ONLY. The web process never holds it.
#   .env.db     the database's bootstrap passwords (superuser and both roles): read by db ONLY.
# The backend image is built with deploy-time secrets kept OUT of it (see .dockerignore); a secret that is
# copied into an image is readable by whatever runs from it.
#
# Only Caddy has open ports (80 and 443). The database and the app are reachable only over the private
# compose network. Caddy serves the built web app and forwards /api, /auth and /admin to Django on the same
# host, so the browser only ever talks to one origin.
#
# Moving the database to RDS later is a change to DATABASE_URL (.env.prod) and DATABASE_OWNER_URL
# (.env.owner), and removing the `db` service; nothing else in this file changes.

name: autoca

# Every container's output goes to CloudWatch Logs (group /autoca/prod, in the instance's own account), and
# `docker compose logs` keeps working beside it. The group and the instance role's permission to write to it
# must exist BEFORE containers start with this driver, or they refuse to start. Non-blocking, so that if
# CloudWatch is unreachable the app drops log lines instead of stalling on them.
x-logging: &cloudwatch
  driver: awslogs
  options:
    awslogs-region: ap-south-1
    awslogs-group: /autoca/prod
    tag: "{{.Name}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  db:
    image: postgres:16
    env_file: .env.db
    environment:
      POSTGRES_DB: autoca
      POSTGRES_USER: postgres
    # Sized for a 2 GB server shared with the app: the defaults assume a machine that does nothing else.
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "effective_cache_size=768MB", "-c", "max_connections=60"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the owner and app roles on first start, with the passwords above. Runs once.
      - ./scripts/bootstrap_db_roles_prod.sql:/bootstrap_db_roles.sql:ro
      - ./deploy/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoca"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Reachable from the instance itself and from nowhere else: an administrator's SSM port-forwarding session ends here
    # (docs/LIVE.md). Bound to loopback, so it is not on the network and not on the internet.
    ports:
      - "127.0.0.1:5432:5432"
    logging: *cloudwatch
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *cloudwatch
    restart: unless-stopped

  # Runs once per deploy. Migrations use the owner role, which the web process never holds. The final
  # check refuses to start a deployment whose settings are unsafe (see core/checks.py).
  migrate:
    build: .
    image: autoca-app:prod
    # The only service that receives the owner role's login.
    env_file:
      - .env.prod
      - .env.owner
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    # grant_app_role runs BEFORE migrate as well as after. On a brand-new database a data migration reads a
    # table through the app role (superadmin 0004 does), and the app role has no permission on tables until
    # the grants and default privileges exist. After a migrate it covers anything the migrations created.
    # A list, not a folded block: a folded block keeps the line breaks of its more-indented lines, which
    # puts '&&' at the start of a shell line and fails with a syntax error.
    command:
      - sh
      - -c
      - python manage.py grant_app_role --database=owner && python manage.py migrate --database=owner --noinput && python manage.py grant_app_role --database=owner && python manage.py check --deploy --database default
    depends_on:
      db:
        condition: service_healthy
    logging: *cloudwatch
    restart: "no"

  web:
    image: autoca-app:prod
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CACHE_URL: redis://redis:6379/1
    expose:
      - "8000"
    # The image's own probe asks for http://127.0.0.1:8000/healthz, which production correctly refuses
    # (that is not a host the app answers to, and it forces https). This asks the way Caddy does: for the
    # real host, saying it arrived over https.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': '${API_HOST}', 'X-Forwarded-Proto': 'https'}), timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *cloudwatch
    restart: unless-stopped

  # Reads the rows waiting for the assistant, for every client, so nobody needs a page open for it to happen. The same
  # image and settings as web; one small process (python manage.py run_assistant). It shares web's cache, which is
  # where a rate-limit pause is kept, so the screens can say when it is paused.
  assistant:
    image: autoca-app:prod
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CACHE_URL: redis://redis:6379/1
    command: ["python", "manage.py", "run_assistant"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *cloudwatch
    restart: unless-stopped

  # Caddy with the built web app inside (web/Dockerfile.caddy builds it). Its context is web/, so nothing
  # from the backend, and none of the .env files, can end up in it.
  caddy:
    build:
      context: ./web
      dockerfile: Dockerfile.caddy
    image: autoca-caddy:prod
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST in .env.prod}
      API_HOST: ${API_HOST:?set API_HOST in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and their account live here. Losing them only means asking Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *cloudwatch
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
