# Production on one AWS instance: the app, its database, redis, and Caddy for HTTPS.
#
#   deploy/init-env.sh api.example.in my-bucket   # writes .env.prod; then fill the secrets it lists
#   docker compose --env-file .env.prod -f compose.prod.yaml build
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d
#
# --env-file is what lets compose read the passwords and API_HOST below; the services read the same
# file themselves. Only Caddy has open ports (80 and 443). The database and the app are reachable
# only over the private compose network.
#
# Moving the database to RDS later is a change to DATABASE_URL and DATABASE_OWNER_URL in .env.prod
# and removing the `db` service; nothing else in this file changes.

name: autoca

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autoca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      AUTOCA_OWNER_PASSWORD: ${AUTOCA_OWNER_PASSWORD:?set AUTOCA_OWNER_PASSWORD in .env.prod}
      AUTOCA_WEB_PASSWORD: ${AUTOCA_WEB_PASSWORD:?set AUTOCA_WEB_PASSWORD in .env.prod}
    # Sized for a 2 GB server shared with the app: the defaults assume a machine that does nothing else.
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "effective_cache_size=768MB", "-c", "max_connections=60"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the owner and app roles on first start, with the passwords above. Runs once.
      - ./scripts/bootstrap_db_roles.sql:/bootstrap_db_roles.sql:ro
      - ./deploy/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Runs once per deploy. Migrations use the owner role, which the web process never holds. The final
  # check refuses to start a deployment whose settings are unsafe (see core/checks.py).
  migrate:
    build: .
    image: autoca-app:prod
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: >
      sh -c "python manage.py migrate --database=owner --noinput
             && python manage.py grant_app_role --database=owner
             && python manage.py check --deploy --database default"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: autoca-app:prod
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CACHE_URL: redis://redis:6379/1
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its account live here. Losing it only means asking Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
