# One VM, one Postgres, one Redis, one web process behind nginx. The boring
# topology the architecture asks for. `docker compose up` brings up a complete
# deployment; the only thing to supply is .env.compose (see .env.example).
#
#   cp .env.example .env.compose   # then fill in the secrets
#   docker compose up --build
#   open http://localhost:8080/app/

name: autoca

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autoca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTOCA_OWNER_PASSWORD: ${AUTOCA_OWNER_PASSWORD:?set AUTOCA_OWNER_PASSWORD}
      AUTOCA_WEB_PASSWORD: ${AUTOCA_WEB_PASSWORD:?set AUTOCA_WEB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the owner and app roles with the least privilege each needs,
      # with the passwords above substituted in. Runs once, on first start.
      - ./scripts/bootstrap_db_roles.sql:/bootstrap_db_roles.sql:ro
      - ./deploy/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoca"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once. Migrations use the owner role; the web process never has it.
  migrate:
    build: .
    env_file: .env.compose
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://autoca_web:${AUTOCA_WEB_PASSWORD:?set AUTOCA_WEB_PASSWORD}@db:5432/autoca
      DATABASE_OWNER_URL: postgresql://autoca_owner:${AUTOCA_OWNER_PASSWORD:?set AUTOCA_OWNER_PASSWORD}@db:5432/autoca
      DATABASE_SSL_REQUIRE: "0"
      DATABASE_IS_POOLED: "0"
    command: >
      sh -c "python manage.py migrate --database=owner --noinput
             && python manage.py grant_app_role --database=owner
             && python manage.py check --deploy --database default"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file: .env.compose
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgresql://autoca_web:${AUTOCA_WEB_PASSWORD:?set AUTOCA_WEB_PASSWORD}@db:5432/autoca
      DATABASE_OWNER_URL: postgresql://autoca_owner:${AUTOCA_OWNER_PASSWORD:?set AUTOCA_OWNER_PASSWORD}@db:5432/autoca
      DATABASE_SSL_REQUIRE: "0"
      DATABASE_IS_POOLED: "0"
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      TRUSTED_PROXY_COUNT: "1"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-0}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
