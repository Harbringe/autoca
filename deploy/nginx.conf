# The one proxy in front of the application. TLS terminates here in a real
# deployment (Let's Encrypt via certbot, or put Cloudflare in front); this file
# is the plain-HTTP shape used by compose. TRUSTED_PROXY_COUNT=1 on the app
# side means exactly this hop is trusted to set X-Forwarded-For.

upstream autoca {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # A bank statement is a few megabytes; the app refuses above 25 MB anyway.
    client_max_body_size 26m;

    # Slow-loris protection and sane timeouts for a synchronous app server.
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    # Basic per-address rate limit on the authentication endpoints, in addition
    # to the application's own per-account lockout.
    location ~ ^/auth/(login|mfa)/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://autoca;
        include /etc/nginx/proxy_params;
    }

    # Server-sent events must not be buffered.
    location ~ ^/api/v1/jobs/.+/events/$ {
        proxy_pass http://autoca;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://autoca;
        include /etc/nginx/proxy_params;
    }
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
