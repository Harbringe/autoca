[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts = -q --strict-markers
testpaths = core integrations banking classify
filterwarnings =
    error::DeprecationWarning:core.*
    error::DeprecationWarning:integrations.*
    error::DeprecationWarning:banking.*
    error::DeprecationWarning:classify.*
