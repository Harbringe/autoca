[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts = -q --strict-markers --reuse-db
testpaths = core integrations documents banking classify ledger api
filterwarnings =
    error::DeprecationWarning:core.*
    error::DeprecationWarning:integrations.*
    error::DeprecationWarning:banking.*
    error::DeprecationWarning:classify.*
    error::DeprecationWarning:ledger.*
    error::DeprecationWarning:api.*
