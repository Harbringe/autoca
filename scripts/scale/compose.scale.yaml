# A throwaway database for finding out how the app behaves with a lot of rows, on the same kind of server as production.
#
#   scripts/scale/scale.sh up | fill | time | stats | down      (see docs/SCALE.md)
#
# It is a separate Compose project (autoca-scale): its own Postgres, its own network, its own volume. It shares nothing with the
# live stack, holds no live credentials or keys (scale.sh makes fresh ones), and publishes no port. The database is called
# autoca_scale_test and the fill script refuses to run against any other name. Both containers are capped so that the real site,
# on the same 2 GB server, keeps its share.

name: autoca-scale

services:
  db:
    image: postgres:16
    env_file: ${SCALE_ENV:?run through scale.sh}
    environment:
      POSTGRES_DB: autoca_scale_test
      POSTGRES_USER: postgres
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=30
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    mem_limit: 480m
    cpus: 0.5
    volumes:
      - scale_pgdata:/var/lib/postgresql/data
      - ${REPO:?run through scale.sh}/scripts/bootstrap_db_roles_prod.sql:/bootstrap_db_roles.sql:ro
      - ${REPO}/deploy/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoca_scale_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The app's own image, run once per command with the scripts mounted read-only. Settings are production's, pointed at the
  # scratch database with throwaway keys.
  tool:
    image: autoca-app:prod
    profiles: ["tools"]
    env_file: ${SCALE_ENV}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      PYTHONPATH: /srv/app
      DATABASE_SSL_REQUIRE: "0"
      FRONTEND_URL: https://scale.invalid
      DJANGO_ALLOWED_HOSTS: scale.invalid
    volumes:
      - ${SCALE_DIR:?run through scale.sh}:/scale:ro
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      db:
        condition: service_healthy

  # The app itself, for the concurrent-users and upload tests (profile "load": scale.sh web-up starts it, web-down removes it). The same image
  # and gunicorn as production, with two workers instead of three because it shares the 2 GB server with the live site. Reachable only
  # as web:8000 from this project's own network; the only people who can sign in are the ones the load script creates in the scratch
  # database.
  web:
    image: autoca-app:prod
    profiles: ["load"]
    env_file: ${SCALE_ENV}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_SSL_REQUIRE: "0"
      FRONTEND_URL: https://scale.invalid
      DJANGO_ALLOWED_HOSTS: scale.invalid
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "2", "--timeout", "120"]
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': 'scale.invalid', 'X-Forwarded-Proto': 'https'}), timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  scale_pgdata:
