{% extends "_mfa_base.html" %}
{% block title %}Two-factor authentication{% endblock %}
{% block submit %}Verify{% endblock %}
{% block body %}
  <h1>Two-factor authentication</h1>
  <p class="sub">{{ email }}</p>
  <label for="token">Enter the 6-digit code from your authenticator app</label>
  <input id="token" name="token" inputmode="numeric" autocomplete="one-time-code"
         pattern="[0-9]*" maxlength="6" required autofocus>
{% endblock %}
