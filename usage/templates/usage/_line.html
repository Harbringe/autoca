{% if chart.empty %}<p class="usage-empty">{{ empty }}</p>{% else %}
<div class="usage-scroll"><svg class="usage-chart usage-chart--half" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ summary }}">
  {% for g in chart.grid %}<line class="usage-grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ g.y }}" y2="{{ g.y }}"/><text class="usage-axis" x="{{ chart.left|add:'-8' }}" y="{{ g.y }}" text-anchor="end" dominant-baseline="middle">{{ g.label }}</text>{% endfor %}
  {% for r in chart.runs %}<polyline class="usage-line" points="{{ r }}" fill="none"/>{% endfor %}
  {% for d in chart.dots %}<circle class="usage-dot{% if d.is_last %} usage-dot--last{% endif %}" cx="{{ d.cx }}" cy="{{ d.cy }}" r="3.5"><title>{{ d.title }}</title></circle>{% endfor %}
  {% for t in chart.ticks %}<text class="usage-axis" x="{{ t.x }}" y="{{ chart.label_y }}" text-anchor="middle">{{ t.label }}</text>{% endfor %}
</svg></div>{% endif %}
