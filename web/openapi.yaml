    ReviewBandEnum:
      enum:
      - HIGH
      - ADVISED
      - JUDGEMENT
      type: string
      description: |-
        * `HIGH` - High confidence -- bulk approvable
        * `ADVISED` - Review advised
        * `JUDGEMENT` - Needs human judgement
    ReviewSummary:
      type: object
      description: |-
        How much work is waiting, split by how much thought each row needs.

        The ordering is the feature: it is what turns an hour of checking every row
        into minutes of checking the ones that need it.
      properties:
        high:
          type: integer
          description: High confidence. Eligible for bulk approval.
        advised:
          type: integer
          description: Suggested, but worth a look.
        judgement:
          type: integer
          description: No suggestion. Needs a person.
        total:
          type: integer
        bulk_approvable:
          type: integer
          description: 'How many a whole-band approval would post: the high band,
            less rows on a party''s account.'
        needs_settlement:
          type: integer
          description: Waiting rows placed on a supplier's or customer's own account.
            Each needs a person to say which bills it settles.
        unresolved:
          type: integer
          description: Of the total, how many have no ledger yet.
        pending_approval:
          type: integer
          description: Of the total, how many have a ledger and await a senior CA.
        assistant_waiting:
          type: integer
          description: Rows queued for the assistant that it has not finished with.
            Above zero, the app should ask for the next batch.
      required:
      - advised
      - assistant_waiting
      - bulk_approvable
      - high
      - judgement
      - needs_settlement
      - pending_approval
      - total
      - unresolved
