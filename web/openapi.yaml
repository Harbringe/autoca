    Classification:
      type: object
      description: A row awaiting a decision, with everything needed to make it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        transaction:
          allOf:
          - $ref: '#/components/schemas/StatementTransaction'
          readOnly: true
        ledger:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        ledger_name:
          type: string
          readOnly: true
          nullable: true
        ledger_status:
          type: string
          readOnly: true
          nullable: true
        ledger_group:
          type: string
          readOnly: true
          nullable: true
        ledger_group_display:
          type: string
          readOnly: true
          nullable: true
        ledger_opened_by_model:
          type: boolean
          readOnly: true
        voucher_type:
          type: string
          nullable: true
          readOnly: true
        entry_legs:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Both sides of the entry this row makes, as a voucher shows them.

            Every transaction touches two accounts: the bank, and whatever the
            money was for. Money out debits the other ledger and credits the bank;
            money in is the reverse. ``ledger`` is null while the row is unplaced,
            and the leg is still listed so the entry is visibly incomplete rather
            than looking like a one-sided one.
          readOnly: true
        book_narration:
          type: string
          readOnly: true
        open_question:
          type: string
          readOnly: true
        party:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        party_name:
          type: string
          readOnly: true
          nullable: true
        party_resolution:
