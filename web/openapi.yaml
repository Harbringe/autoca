  /api/v1/classifications/{id}/confirm-party/:
    post:
      operationId: classifications_confirm_party_create
      description: Confirms which party this payee is, without placing the row in
        a ledger. The spelling is remembered, so the same spelling resolves on its
        own from now on, and every other unposted row for it is updated at once.
      summary: Say who a row's payee is
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
