        state:
          allOf:
          - $ref: '#/components/schemas/AssistantStateEnum'
          description: |-
            `working`: call again. `idle`: nothing is waiting, or the assistant is off; stop. `paused`: call again after `retry_after_seconds`.

            * `working` - working
            * `idle` - idle
            * `paused` - paused
        retry_after_seconds:
          type: integer
          nullable: true
          description: When to call again. Null when the call may be repeated straight
            away.
        reason:
          description: "Why the assistant is paused or idle. Blank when it is working.\n\
            \n* `` - \n* `rate_limit` - rate_limit\n* `daily_limit` - daily_limit\n\
            * `provider_down` - provider_down\n* `assistant_off` - assistant_off"
          oneOf:
          - $ref: '#/components/schemas/AssistantReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        message:
          type: string
          description: One plain sentence to show.
        auto_posted:
          type: integer
          description: Of the suggested rows, how many were sure enough to be posted
            automatically.
        proposed:
          type: integer
          description: New ledgers the assistant opened in this call.
