      - gstin
      - id
      - state_code
    ReportRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The match id; send it as `match` when recording a decision.
        itc_status:
          allOf:
          - $ref: '#/components/schemas/ItcStatusEnum'
          description: |-
            eligible; blocked (a section 17(5) category); not_eligible (not claimable on this evidence yet); rcm_on_payment (reverse charge, claimable after the tax is paid).

            * `eligible` - eligible
            * `blocked` - blocked
            * `not_eligible` - not_eligible
            * `rcm_on_payment` - rcm_on_payment
        eligible_paise:
          type: integer
          description: Credit claimable on this row with the latest decision applied;
            negative for a credit note.
        ineligible_paise:
          type: integer
          description: Credit this row carries that is not claimable, with the latest
            decision applied.
        cause:
          type: string
          description: Why the row is in this group.
        action:
          type: string
          description: What the preparer should do about it.
        timing:
          type: boolean
          description: The difference is one of month, not an error (for example the
            supplier has not filed yet).
        differences:
          type: object
          additionalProperties:
            type: integer
          description: Books minus GSTR-2B in paise, keyed by `taxable_paise`, `igst_paise`,
            `cgst_paise`, `sgst_paise`, `cess_paise`; only the heads that differ beyond
            rounding.
        book:
          allOf:
          - $ref: '#/components/schemas/ReportInvoice'
          nullable: true
          description: Null when the invoice is only in GSTR-2B.
        portal:
          allOf:
          - $ref: '#/components/schemas/ReportInvoice'
          nullable: true
          description: Null when the invoice is only in the books.
        decision:
          allOf:
          - $ref: '#/components/schemas/ReportDecision'
          nullable: true
          description: The latest decision on this invoice; null if none. Notes do
            not count.
      required:
      - action
      - book
      - cause
      - decision
      - differences
      - eligible_paise
      - id
      - ineligible_paise
      - itc_status
      - portal
      - timing
    ReportSummary:
      type: object
      properties:
        counts:
          type: object
