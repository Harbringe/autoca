  /api/v1/clients/{client_id}/review-queue/:
    get:
      operationId: clients_review_queue_list
      description: |-
        Everything still to be dealt with, surest first.

        "Still to be dealt with" means **not yet posted to the ledger** -- not "not
        yet looked at". A row a person has placed but nobody has approved is not
        finished work, and a queue that hid it is how a month closes short.
      summary: The review queue
      parameters:
      - in: query
        name: band
        schema:
          type: string
          enum:
          - ADVISED
          - HIGH
          - JUDGEMENT
        description: HIGH is bulk-approvable. ADVISED is suggested but worth a look.
          JUDGEMENT has no suggestion and needs a person.
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: stage
        schema:
          type: string
          enum:
          - pending_approval
          - unresolved
        description: '`unresolved` is the half with no ledger yet; `pending_approval`
          is the half waiting on a senior CA. Omit for both.'
      tags:
      - review
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassificationList'
          description: ''
  /api/v1/clients/{client_id}/review-queue/recategorize/:
    post:
      operationId: clients_review_queue_recategorize_create
      description: |-
        Asks the model again about every row that is **not posted** and was **not placed by a person** -- rule placements, earlier model suggestions and unresolved rows alike. Pass `statement` to limit it to one statement.

        Where the model agrees with a rule, the rule's placement stands (`confirmed`). Where it disagrees, the row becomes a model suggestion in the ADVISED band, so a person sees the disagreement before it can be posted (`suggested`). Where it declines, nothing changes but the rationale (`declined`). Posted entries are immutable and never touched. Returns **202** with a job.
      summary: Re-categorize with the model
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecategorizeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecategorizeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecategorizeRequest'
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/clients/{client_id}/review-queue/suggest/:
    post:
      operationId: clients_review_queue_suggest_create
      description: |-
        Puts every unresolved row that no other window is reading back in the assistant's queue, with its tries counted afresh, and returns at once. The reading itself happens a few rows at a time through `POST /clients/{client_id}/assistant/next-batch/`. Returns **202** with a job; the result carries `considered` and `waiting_for_assistant` (rows queued now) and an empty `warning`.

        Nothing identifying leaves the server: narrations are masked, people are pseudonymised, known parties are aliased. Requires `transaction.classify`.
      summary: Ask the assistant about every unresolved row again
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/clients/{client_id}/review-queue/summary/:
    get:
      operationId: clients_review_queue_summary_retrieve
      description: 'Split by how much thought each row needs. The ordering is the
