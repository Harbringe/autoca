          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          readOnly: true
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        amount_display:
          type: string
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        is_debit:
          type: boolean
          readOnly: true
        is_posted:
          type: boolean
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/MethodB54Enum'
          readOnly: true
        method_display:
          type: string
          readOnly: true
