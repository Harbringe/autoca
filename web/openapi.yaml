          type: string
          format: date
          description: The invoice date. Must be before the date the opening balance
            stands at.
        amount_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: 1
          format: int64
          description: Whole paise still owing on that invoice.
        due_date:
