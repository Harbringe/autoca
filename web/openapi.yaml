    ReportFooter:
      type: object
      description: |-
        What a reader needs in order to trust, or distrust, the figures above.

        ``is_complete`` is false whenever anything is still unposted, and the
        caption says so in words. A report over incomplete books is not wrong, but
        handing one to a client without knowing that is.
      properties:
        client_name:
          type: string
        financial_year:
          type: integer
        fy_label:
          type: string
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        entry_count:
          type: integer
        pending_review:
          type: integer
        is_complete:
          type: boolean
        generated_at:
          type: string
          format: date-time
        caption:
          type: string
          readOnly: true
      required:
      - caption
      - client_name
      - entry_count
      - financial_year
      - fy_label
      - generated_at
      - is_complete
      - pending_review
      - period_end
      - period_start
    RequiredNoteRequest:
      type: object
      properties:
        note:
          type: string
          minLength: 1
          description: Why -- shown to whoever reads the history.
          maxLength: 1000
      required:
      - note
    ReviewBandEnum:
      enum:
      - HIGH
      - ADVISED
      - JUDGEMENT
      type: string
      description: |-
        * `HIGH` - High confidence -- bulk approvable
        * `ADVISED` - Review advised
        * `JUDGEMENT` - Needs human judgement
    ReviewSummary:
      type: object
      description: |-
        How much work is waiting, split by how much thought each row needs.

        The ordering is the feature: it is what turns an hour of checking every row
        into minutes of checking the ones that need it.
      properties:
        high:
          type: integer
          description: High confidence. Eligible for bulk approval.
        advised:
          type: integer
          description: Suggested, but worth a look.
        judgement:
          type: integer
          description: No suggestion. Needs a person.
        total:
          type: integer
        bulk_approvable:
          type: integer
        unresolved:
          type: integer
          description: Of the total, how many have no ledger yet.
        pending_approval:
          type: integer
          description: Of the total, how many have a ledger and await a senior CA.
      required:
      - advised
      - bulk_approvable
      - high
      - judgement
      - pending_approval
      - total
      - unresolved
