  /api/v1/clients/{client_id}/bills/:
    get:
      operationId: clients_bills_list
      description: |-
        A client's purchase and sales invoices and the notes that reverse them.

        Each bill is booked to its party's own account on its own date, apart from whatever later pays it, which is what
        makes "what do we owe this supplier" answerable. A bill is a permanent fact: it is posted or removed, never edited,
        and once the books are signed off it cannot be removed at all.
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: fy
        schema:
          type: integer
        description: 'Financial year by its starting year: 2025 means FY2025-26.'
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - CREDIT_NOTE
          - DEBIT_NOTE
          - OPENING
          - PURCHASE
          - SALES
        description: Only this kind.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: party
        schema:
          type: string
        description: Only this party's bills.
      - in: query
        name: q
        schema:
          type: string
        description: Part of the invoice number or the party's name.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - open
          - settled
        description: Only bills still owing, or fully settled.
      tags:
      - bills
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillList'
          description: ''
    post:
      operationId: clients_bills_create
      description: |-
        Writes the voucher, the bill and the journal lines together, or nothing. Needs `journal.approve` on a client the caller may post to, and is refused inside signed-off books.

        Money is whole paise. A purchase credits the supplier the taxable value plus GST, less any TDS typed here; under reverse charge the supplier is owed only the taxable value. A sale debits the customer. A debit note reverses a purchase and a credit note a sale. The GST split is as printed on the invoice: it is not computed from the place of supply in this version.

        The same invoice number from the same supplier in the same financial year is refused as a duplicate (422 `billing_rule`), however the number is punctuated.
      summary: Book a purchase, sales, debit-note or credit-note voucher
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDetail'
          description: ''
