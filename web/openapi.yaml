    StatementUploadRequest:
      type: object
      description: |-
        A statement PDF, for a client.

        The bank is not asked for and cannot be supplied. It is read from the file:
        a dropdown is one more way to file a statement against the wrong account,
        and the statement itself is the authority on which account it belongs to.
      properties:
        file:
          type: string
          format: binary
          description: The statement PDF, as uploaded by the client.
        layout:
          type: string
          default: ''
          description: 'Only after a statement was refused for its columns: a JSON
            object naming which table column holds what, counting from 0, like `{"date":
            0, "narration": 4, "debit": 5, "credit": 6, "balance": 7}`. The reader
            still proves it against the statement''s own running balance.'
        allow_gap:
          type: boolean
          default: false
          description: Accept a statement that does not continue from the last one
            on file. A gap means a missing period, so this defaults to refusing; set
            it only when the earlier period genuinely is not available.
      required:
      - file
