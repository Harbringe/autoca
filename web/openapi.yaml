  /api/v1/clients/{client_id}/statements/upload/:
    post:
      operationId: clients_statements_upload_create
      description: |-
        Accepts the PDF and returns **202 Accepted** with a job. Poll `/api/v1/jobs/{id}/` or subscribe to its events.

        The bank is not asked for and cannot be supplied: it is read from the file. The statement itself is the authority on which account it belongs to, and a dropdown is one more way to file one against the wrong account.

        On success the job result carries `statement`, `rows_created`, `rows_already_present`, `needs_opening_confirmation` and the outcome of the first classification pass. Re-uploading the same file returns the original statement rather than a duplicate.

        Failures that are about the *file* rather than the request come back on the job with a code: `no_text_layer` (a scan -- OCR is not wired), `unsupported_bank`, `balance_chain_broken`, `statement_period_missing`.
      summary: Upload a statement
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - statements
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatementUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatementUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
