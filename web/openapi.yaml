    OpeningBalanceRequest:
      type: object
      description: |-
        Confirming what the client's books actually started from.

        Deliberately an explicit act rather than something inferred. A client
        onboarding in October has six months of history this system never saw, and
        starting them at the October statement's opening line misstates every
        balance from then on.
      properties:
        opening_balance_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        opening_as_of:
          type: string
          format: date
          description: The date that balance was true. Normally the first day of the
            period.
        acknowledge_difference:
          type: boolean
          default: false
          description: Set to keep a figure that differs from the opening of the statement
            beginning on that date. Without it a difference (and above all a flipped
            sign on an overdraft) is refused with `409 opening_differs`.
      required:
      - opening_as_of
      - opening_balance_paise
