  /api/v1/journal-entries/{id}/correct/:
    post:
      operationId: journal_entries_correct_create
      description: |-
        The original is not edited -- it cannot be. A correction is a new entry carrying a reversal of the original's lines plus the corrected ones, linked back to it. The original stays visible, which is what company law expects, and the two together net to the corrected position so the trial balance is right at every point in the chain.

        Requires `journal.correct` (staff and above, on their assigned clients). Once the entry is inside signed-off books only the client's lead or a firm administrator may adjust it; anyone else is told it is locked (409 `entry_locked`).
      summary: Correct a posted entry
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
