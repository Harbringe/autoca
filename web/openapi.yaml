      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPartyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPartyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPartyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
          description: ''
  /api/v1/classifications/{id}/review/:
    post:
      operationId: classifications_review_create
      description: |-
        Records the full treatment -- ledger head, party, reverse charge, TDS -- and, unless `learn` is false, teaches a rule from it. The rule is keyed on the payee rather than the narration, so it covers that payee permanently: placing one of nine identical cashback credits places all nine.

        This does **not** post anything to the ledger. It moves the row from the unresolved half of the queue to the half waiting for approval.
      summary: Place a row in a ledger
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
