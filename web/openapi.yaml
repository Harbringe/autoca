            schema:
              $ref: '#/components/schemas/CorrectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: ''
