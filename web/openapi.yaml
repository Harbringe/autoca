openapi: 3.0.3
info:
  title: AutoCA API
  version: 1.0.0
  description: |-
    Bank statements in, approved double-entry journal entries out.

    ### Two conventions worth knowing before you read anything else

    **Money is always a whole number of paise**, in a field named `*_paise`. Every amount also carries a `*_display` twin, already formatted with Indian digit grouping (`Rs 6,03,490.57`). Use the integer for arithmetic and the string for rendering, and never parse the string or format the integer yourself -- a JSON number with a decimal point becomes a float in a browser, which is exactly the rounding error the backend exists to avoid.

    **Nothing is final until a senior CA signs the books off.** Uploading a statement and classifying its rows produces *suggestions*. Rows reach the books in two ways: a person posts them (`POST /clients/{id}/approvals/`), or the assistant posts high-confidence rows automatically. Those entries carry a marker (posted by the assistant) and stay changeable until sign-off. Sign-off is refused while any such entry on or before the sign-off date is unchecked; a person checks them and marks them reviewed. Once signed off, entries cannot be edited or deleted -- corrections are new entries that reverse and replace.

    ### Slow work

    Uploading a statement returns **202 Accepted** with a job. Poll `/jobs/{id}/` or subscribe to `/jobs/{id}/events/` for server-sent events.

    ### Errors

    Failures carry a stable `code` and a `detail` written to be read by a person -- the parser's messages name the row and the figure that broke, and they are passed through rather than replaced. `422` means the document could not be read; `409` means the request conflicts with the current state; `403` is a role boundary and is never disguised as a 404.
paths:
  /api/v1/audit/:
    get:
      operationId: audit_retrieve
      description: GET /api/v1/audit/?user=<membership id>&client=<id>&from=YYYY-MM-DD&to=YYYY-MM-DD&failed=true
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/bank-accounts/{id}/reconciliation/:
    get:
      operationId: bank_accounts_reconciliation_retrieve
      description: |-
        Compares the computed bank-ledger balance against the statement's own closing figure. One subtraction that catches what every other check misses -- a row posted twice, a correction reversed the wrong way, an entry approved against the wrong account.

        `can_close` is the one to act on: it requires both that the figures agree *and* that nothing up to that date is still unposted. A period that does not reconcile is not finished.
      summary: Month-end balance check
      parameters:
      - in: query
        name: as_of
        schema:
          type: string
        description: Date to reconcile at, as YYYY-MM-DD.
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceCheck'
          description: ''
  /api/v1/classifications/:
    get:
      operationId: classifications_list
      description: One transaction's classification, and the decision endpoint.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
