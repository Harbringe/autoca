  /api/v1/clients/{client_id}/assistant/next-batch/:
    post:
      operationId: clients_assistant_next_batch_create
      description: |-
        Reads one small batch (10 rows unless `max_rows` says otherwise, at most 15) of the rows the upload could not place, and returns at once with what happened and what to do next. Call it again while `state` is `working`; wait `retry_after_seconds` first when it is `paused`; stop when it is `idle`.

        A call takes about twenty seconds at most and never waits out a rate limit: it reports `paused` with the seconds to wait. `reason` says why: `rate_limit` (this minute's allowance), `daily_limit` (today's; the rest is for a person or for tomorrow), `provider_down`, or `assistant_off` (no model is configured, so nothing will ever be read and `state` is `idle`).

        Two windows open on the same client never read the same row. Rows the model is very sure of are posted automatically, marked as the assistant's, exactly as before. A row it cannot answer after three tries is left for a person. Requires `transaction.classify`.
      summary: Read the next few waiting rows with the assistant
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NextBatchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NextBatchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NextBatchRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextBatch'
          description: ''
