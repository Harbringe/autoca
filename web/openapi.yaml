components:
  schemas:
    AcceptProposalRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Rename to match the client's Tally company exactly.
          maxLength: 255
        group:
          $ref: '#/components/schemas/GroupEnum'
    ApproveRequest:
      type: object
      description: |-
        Post reviewed rows to the immutable journal.

        Either an explicit list of classification ids, or a whole confidence band --
        the latter is the one-click bulk approval the review screen offers for
        everything the system is sure about.
      properties:
        classifications:
          type: array
          items:
            type: string
            format: uuid
        band:
          $ref: '#/components/schemas/BandEnum'
    BalanceCheck:
      type: object
      description: |-
        Month end: does the ledger agree with the bank?

        The check that catches what every other one misses -- a row posted twice, a
        correction reversed the wrong way, an entry approved against the wrong
        account -- in one subtraction.
      properties:
        as_of:
          type: string
          format: date
        ledger_balance_paise:
          type: integer
          description: What the client's books say.
        statement_balance_paise:
          type: integer
          description: What the bank's own statement says.
        difference_paise:
          type: integer
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        matches:
          type: boolean
        can_close:
          type: boolean
          description: Reconciles *and* nothing up to that date is still unposted.
        unapproved_count:
          type: integer
        explanation:
          type: string
          readOnly: true
        ledger_balance_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        statement_balance_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        difference_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - as_of
      - can_close
      - difference_display
      - difference_paise
      - explanation
      - ledger_balance_display
      - ledger_balance_paise
      - matches
      - statement_balance_display
      - statement_balance_paise
      - unapproved_count
    BalanceSheet:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
        liabilities:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
        total_assets_paise:
          type: integer
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        total_liabilities_paise:
          type: integer
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        total_liabilities_and_profit_paise:
          type: integer
          description: Liabilities plus the year's profit (or minus its loss). Equals
            total assets when the sheet balances.
        net_profit_paise:
          type: integer
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        suspense_paise:
          type: integer
          description: Anything unanswered. A balance sheet with a suspense figure
            has a question on it.
        balances:
          type: boolean
        footer:
          $ref: '#/components/schemas/ReportFooter'
        total_assets_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        total_liabilities_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        total_liabilities_and_profit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        net_profit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        suspense_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - assets
      - balances
      - footer
      - liabilities
      - net_profit_display
      - net_profit_paise
      - suspense_display
      - suspense_paise
      - total_assets_display
      - total_assets_paise
      - total_liabilities_and_profit_display
      - total_liabilities_and_profit_paise
      - total_liabilities_display
      - total_liabilities_paise
    BandEnum:
      enum:
      - HIGH
      - ADVISED
      - JUDGEMENT
