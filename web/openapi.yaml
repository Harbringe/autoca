  /api/v1/clients/{client_id}/tally-imports/{id}/confirm/:
    post:
      operationId: clients_tally_imports_confirm_create
      description: |-
        Applies exactly what the person chose, in one transaction: creates the ledgers, applies the choices on conflicts, stores the opening balances (a bank account's opening goes to the bank account, once). **Idempotent**: confirming a run that was already applied returns it unchanged.

        Every row whose `action` is `conflict` or `needs_group`, and every `bank` panel with status `conflict`, needs a resolution; otherwise `409 tally_conflicts_unresolved` and nothing is written. `409 tally_run_stale` when the client's ledgers or openings changed since the preview (upload again). `409 entry_locked` when the books are signed off through the start of the year. A group cannot be changed on a ledger with posted lines (`409 tally_rule`).
      summary: Apply a previewed Tally import
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ledger
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TallyConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TallyConfirmRequest'
          application/json:
            schema:
