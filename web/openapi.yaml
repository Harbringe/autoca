  /api/v1/clients/{client_id}/approvals/:
    post:
      operationId: clients_approvals_create
      description: |-
        The moment a suggestion becomes a ledger entry. Any role that prepares books (staff and above) may post on the clients it is assigned to; the entry stays a working draft, changeable and logged, until a senior signs the books off. Checked server-side, not by a hidden button.

        Send either an explicit list of classification ids, or a whole confidence band. `band=HIGH` is the one-click bulk approval for everything the system is sure about.

        **All or nothing.** One unapprovable row fails the batch rather than leaving it half-posted, which would be worse -- the reviewer would have to work out which half.
      summary: Approve classified rows
      parameters:
      - in: path
        name: client_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - ledger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalEntryList'
          description: ''
