    StatementUploadRequest:
      type: object
      description: |-
        A statement PDF, for a client.

        The bank is not asked for and cannot be supplied. It is read from the file:
        a dropdown is one more way to file a statement against the wrong account,
        and the statement itself is the authority on which account it belongs to.
      properties:
        file:
          type: string
          format: binary
          description: The statement PDF, as uploaded by the client.
        allow_gap:
          type: boolean
          default: false
          description: Accept a statement that does not continue from the last one
            on file. A gap means a missing period, so this defaults to refusing; set
            it only when the earlier period genuinely is not available.
      required:
      - file
    TallyExport:
      type: object
      description: |-
        A Tally Prime import document, and what was left out of it.

        ``unapproved`` is not an error. A firm exporting nine tenths of a statement
        while three rows wait on a client's answer is a normal Tuesday -- but an
        export that quietly included them would not be.
      properties:
        xml:
          type: string
        voucher_count:
          type: integer
        ledger_count:
          type: integer
        unapproved:
          type: integer
          description: Rows classified but not approved, and therefore not exported.
      required:
      - ledger_count
      - unapproved
      - voucher_count
      - xml
    TdsSectionEnum:
      enum:
      - '192'
      - 194A
      - 194C
      - 194H
      - 194I
      - 194J
      - 194Q
      type: string
      description: |-
        * `192` - 192 -- Salary
        * `194A` - 194A -- Interest other than securities
        * `194C` - 194C -- Payment to contractors
        * `194H` - 194H -- Commission or brokerage
        * `194I` - 194I -- Rent
        * `194J` - 194J -- Professional or technical fees
        * `194Q` - 194Q -- Purchase of goods
    TreatmentRequest:
      type: object
      description: |-
        One complete accounting decision: where it goes, who it was with, and its tax.

        All four together, because they are decided together and learned together.
        A rule that remembered the ledger and forgot the reverse-charge flag would
        look like it worked until a return was prepared from incomplete books.
      properties:
        ledger:
          type: string
          format: uuid
          description: Ledger account id.
        party:
          type: string
          format: uuid
          nullable: true
          description: Party id, where there is an identifiable one.
        rcm:
          type: boolean
          default: false
          description: 'Reverse charge: the client pays the GST rather than the party.'
        tds_section:
          default: ''
          description: |-
            TDS section, if the payment type crosses its threshold.

            * `192` - 192 -- Salary
            * `194A` - 194A -- Interest other than securities
            * `194C` - 194C -- Payment to contractors
            * `194H` - 194H -- Commission or brokerage
            * `194I` - 194I -- Rent
            * `194J` - 194J -- Professional or technical fees
            * `194Q` - 194Q -- Purchase of goods
          oneOf:
          - $ref: '#/components/schemas/TdsSectionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        learn:
          type: boolean
          default: true
          description: Teach a rule from this decision so the same payee is placed
            automatically from now on. Set false for a genuine one-off.
      required:
      - ledger
    TrialBalance:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
        total_debit_paise:
          type: integer
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        total_credit_paise:
          type: integer
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        balances:
          type: boolean
          description: False means something reached the books without going through
            a voucher.
        footer:
          $ref: '#/components/schemas/ReportFooter'
        total_debit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        total_credit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - balances
      - footer
      - rows
      - total_credit_display
      - total_credit_paise
      - total_debit_display
      - total_debit_paise
    UploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        mapping:
          type: string
          description: 'Optional JSON mapping a field to a header, e.g. {"gstin":
            "Vendor GST"}.'
      required:
      - file
    VoucherTypeEnum:
      enum:
      - Payment
      - Receipt
      - Contra
      - Journal
      type: string
      description: |-
        * `Payment` - Payment
        * `Receipt` - Receipt
        * `Contra` - Contra
        * `Journal` - Journal
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: session
  description: Who is signed in and what they may do.
- name: clients
  description: The firm's clients.
- name: statements
  description: Uploading statements and reading their rows.
- name: review
  description: The review queue and the decisions made against it.
- name: ledger
  description: Approval, the permanent journal, and corrections.
- name: reports
  description: Trial balance, P&L, balance sheet, reconciliation.
- name: jobs
  description: Progress on work the API did not block for.
