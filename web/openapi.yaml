          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Tally's opening for this ledger. Debits positive.
        status:
          allOf:
          - $ref: '#/components/schemas/TallyBankPanelStatusEnum'
          description: |-
            `propose`: no opening is confirmed yet, so Tally's will be written to the bank account. `agree`: the same figure, nothing to do. `conflict`: two different figures; choose one in `bank`. `nothing`: no opening confirmed and none in the file. The ledger never gets a second copy of the number.

            * `propose` - propose
            * `agree` - agree
            * `conflict` - conflict
            * `nothing` - nothing
