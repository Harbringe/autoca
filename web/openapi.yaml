          type: array
          items:
            type: string
        default:
          type: string
          nullable: true
        ours_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        tally_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
