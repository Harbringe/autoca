    MetricsClient:
      type: object
      properties:
        rows_posted:
          type: integer
          description: 'Statement rows that reached the books in the period: journal
            entries approved in the period that stand for a statement row, corrections
            excluded. A transfer between two of the client''s own accounts is one
            entry and counts once.'
        rows_automated:
          type: integer
          description: 'Of those, the rows nobody posted by hand: the assistant posted
            them (no approving person is recorded) and no person has since edited
            the entry.'
        automation_share:
          type: number
          format: double
          nullable: true
          description: rows_automated / rows_posted, between 0 and 1. Null when no
            row was posted in the period.
        placements_stayed:
          type: integer
          description: 'Rule or model placements posted in the period that nobody
            has changed: an automatic post with nothing in the change log, or an entry
            a person posted without changing the placement (the row still carries
            the rule that placed it, or the model''s suggestion with no placement
            by a person recorded against it).'
        placements_changed:
          type: integer
          description: 'Changes made in the period to a rule or model placement: a
            change-log item that moved an automatic entry to other ledgers, the removal
            of one, a correction entry against one, or a person placing a row the
            model had already suggested. A change that only reworded the narration
            is not counted.'
        accuracy:
          type: number
          format: double
          nullable: true
          description: placements_stayed / (placements_stayed + placements_changed),
            between 0 and 1. Null when there is nothing to judge. Stored data cannot
            show a rule placement that a person overrode before posting, nor later
            changes to an entry a person posted from a rule placement, so this figure
            errs high.
        estimated_minutes_saved:
          type: integer
          description: 'rows_automated times assumed_minutes_per_row. An estimate,
            not a measurement: nothing records how long a person would have taken.'
        id:
          type: string
          format: uuid
        name:
          type: string
        needs_attention:
          type: array
          items:
            $ref: '#/components/schemas/AttentionReason'
          description: Empty when nothing needs a look.
      required:
      - accuracy
      - automation_share
      - estimated_minutes_saved
      - id
      - name
      - needs_attention
      - placements_changed
      - placements_stayed
      - rows_automated
      - rows_posted
