      operationId: clients_bank_accounts_opening_balance_create
      description: |-
        What the client's books actually started from. Pre-filled from the first statement's own opening line, but confirmed rather than assumed: a client onboarding in October has six months of history this system never saw, and starting them at that statement's opening figure misstates every balance from then on.

        Month-end reconciliation is not meaningful until this is set.
