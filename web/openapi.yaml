      - confirmed_at
      - counts
      - created_at
      - expires_at
      - financial_year
      - id
      - include_openings
      - kind
      - result
      - source_format
      - status
    TallyImportUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: 'The ledger masters exported from Tally: .xml (preferred),
            .xlsx or .csv.'
        financial_year:
          type: integer
          maximum: 2100
          minimum: 2000
          description: 'The year the opening balances are as at the start of: 2025
            means 1 April 2025.'
        include_openings:
          type: boolean
          default: true
          description: False imports the chart of accounts only. Use it when the file's
            balances are not those at the start of the year (`tally_year_mismatch`).
      required:
      - file
      - financial_year
    TallyResolutionRequest:
      type: object
      properties:
        row:
          type: integer
          minimum: 0
          description: The preview row's `row` number.
        choice:
          allOf:
          - $ref: '#/components/schemas/ChoiceEnum'
          description: |-
            One of that row's `conflict.choices`.

            * `keep_ours` - keep_ours
            * `take_tally` - take_tally
            * `use_tally_name` - use_tally_name
            * `use_this_spelling` - use_this_spelling
            * `skip` - skip
            * `group` - group
        group:
          allOf:
          - $ref: '#/components/schemas/LedgerGroupEnum'
          description: |-
            With `choice: group`: which of our groups a group of the firm's own belongs to.

            * `BANK` - Bank Accounts
            * `CASH` - Cash-in-Hand
            * `DEBTOR` - Sundry Debtors
            * `CREDITOR` - Sundry Creditors
            * `INDIRECT_EXPENSE` - Indirect Expenses
            * `DIRECT_EXPENSE` - Direct Expenses
            * `INDIRECT_INCOME` - Indirect Incomes
            * `DIRECT_INCOME` - Direct Incomes
            * `DUTIES_AND_TAXES` - Duties & Taxes
            * `LOAN` - Loans (Liability)
            * `INVESTMENT` - Investments
            * `CAPITAL` - Capital Account
            * `SUSPENSE` - Suspense A/c
            * `FIXED_ASSET` - Fixed Assets
            * `STOCK` - Stock-in-Hand
            * `CURRENT_ASSET` - Current Assets
            * `LOAN_ADVANCE` - Loans & Advances (Asset)
            * `DEPOSIT` - Deposits (Asset)
            * `MISC_EXPENDITURE` - Misc. Expenses (Asset)
            * `BANK_OD` - Bank OD A/c
            * `CURRENT_LIABILITY` - Current Liabilities
            * `PROVISION` - Provisions
            * `RESERVES` - Reserves & Surplus
            * `SALES` - Sales Accounts
            * `PURCHASE` - Purchase Accounts
        bank:
          allOf:
          - $ref: '#/components/schemas/BankEnum'
          description: |-
            For a row whose `bank` panel needs a decision: one of `bank.choices`.

            * `use_tally` - use_tally
            * `keep_bank` - keep_bank
            * `skip` - skip
      required:
      - row
    TallyResult:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        created:
          type: integer
          description: Ledgers created.
        matched:
          type: integer
          description: Existing ledgers the file matched.
        renamed:
          type: integer
        regrouped:
          type: integer
        openings:
          type: integer
          description: Ledger openings stored.
        bank_openings:
          type: integer
          description: Openings written to a bank account instead.
        skipped:
          type: integer
        debit_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        credit_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        difference_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        debit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        credit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        difference_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - bank_openings
      - created
      - credit_display
      - credit_paise
      - debit_display
      - debit_paise
      - difference_display
      - difference_paise
      - matched
      - openings
      - regrouped
      - renamed
      - skipped
    TallyRow:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        row:
          type: integer
          description: The number to quote in a resolution. Zero-based.
        ordinal:
          type: integer
          description: The line's position in the file (the sheet row, in a spreadsheet).
        name:
          type: string
          description: As Tally spells it, whitespace tidied.
        alias:
          type: string
          nullable: true
        tally_group:
          type: string
          description: The group the file puts it under, as written.
        tally_group_path:
          type: string
          nullable: true
        our_group:
          nullable: true
          description: |-
            Null when the group is one of the firm's own and needs `choice: group`.

            * `BANK` - Bank Accounts
            * `CASH` - Cash-in-Hand
            * `DEBTOR` - Sundry Debtors
            * `CREDITOR` - Sundry Creditors
            * `INDIRECT_EXPENSE` - Indirect Expenses
            * `DIRECT_EXPENSE` - Direct Expenses
            * `INDIRECT_INCOME` - Indirect Incomes
            * `DIRECT_INCOME` - Direct Incomes
            * `DUTIES_AND_TAXES` - Duties & Taxes
            * `LOAN` - Loans (Liability)
            * `INVESTMENT` - Investments
            * `CAPITAL` - Capital Account
            * `SUSPENSE` - Suspense A/c
            * `FIXED_ASSET` - Fixed Assets
            * `STOCK` - Stock-in-Hand
            * `CURRENT_ASSET` - Current Assets
            * `LOAN_ADVANCE` - Loans & Advances (Asset)
            * `DEPOSIT` - Deposits (Asset)
            * `MISC_EXPENDITURE` - Misc. Expenses (Asset)
            * `BANK_OD` - Bank OD A/c
            * `CURRENT_LIABILITY` - Current Liabilities
            * `PROVISION` - Provisions
            * `RESERVES` - Reserves & Surplus
            * `SALES` - Sales Accounts
            * `PURCHASE` - Purchase Accounts
          oneOf:
          - $ref: '#/components/schemas/LedgerGroupEnum'
          - $ref: '#/components/schemas/NullEnum'
        opening_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Debits positive, credits negative. Zero when the file gives
            none.
        action:
          allOf:
          - $ref: '#/components/schemas/TallyRowActionEnum'
          description: |-
            `create` a new ledger; `match` an existing one (same name, same group); `conflict` the person must choose (see `conflict`); `needs_group` a group of the firm's own, choose one of ours; `skipped` not imported, with the reason.

            * `create` - create
            * `match` - match
            * `conflict` - conflict
            * `needs_group` - needs_group
            * `skipped` - skipped
        reason:
          type: string
        ledger_id:
          type: string
          format: uuid
          nullable: true
          description: Our ledger this line matches or collides with.
        ledger_name:
          type: string
          nullable: true
        ledger_group:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LedgerGroupEnum'
          - $ref: '#/components/schemas/NullEnum'
        posted_lines:
          type: integer
          description: Journal lines already posted to our ledger.
        conflict:
          allOf:
          - $ref: '#/components/schemas/TallyConflict'
          nullable: true
        bank:
          allOf:
          - $ref: '#/components/schemas/TallyBankPanel'
          nullable: true
        opening_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - action
      - alias
      - bank
      - conflict
      - ledger_group
      - ledger_id
      - ledger_name
      - name
      - opening_display
      - opening_paise
      - ordinal
      - our_group
      - posted_lines
      - reason
      - row
      - tally_group
      - tally_group_path
    TallyRowActionEnum:
      enum:
      - create
      - match
      - conflict
      - needs_group
      - skipped
      type: string
      description: |-
        * `create` - create
        * `match` - match
        * `conflict` - conflict
        * `needs_group` - needs_group
        * `skipped` - skipped
    TdsMonth:
      type: object
      properties:
        section:
          type: string
          description: The TDS section, or `?` where a deduction carried none.
        financial_year:
          type: integer
        quarter:
          type: integer
          description: 1 is April to June.
        year:
          type: integer
        month:
          type: integer
        deducted_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        deducted_display:
          type: string
        deposited_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Matched to this month, oldest deduction first, from the challans
            recorded for the section.
        deposited_display:
          type: string
        unpaid_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        unpaid_display:
          type: string
        due:
          type: string
          format: date
        overdue:
          type: boolean
      required:
      - deducted_display
      - deducted_paise
      - deposited_display
      - deposited_paise
      - due
      - financial_year
      - month
      - overdue
      - quarter
      - section
      - unpaid_display
      - unpaid_paise
      - year
    TdsPayment:
      type: object
      properties:
        entry:
          type: string
          format: uuid
        entry_date:
          type: string
          format: date
        amount_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        amount_display:
          type: string
      required:
      - amount_display
      - amount_paise
      - entry
      - entry_date
    TdsSectionEnum:
      enum:
      - '192'
      - 194A
      - 194C
      - 194H
      - 194I
      - 194J
      - 194Q
      type: string
      description: |-
        * `192` - 192 -- Salary
        * `194A` - 194A -- Interest other than securities
        * `194C` - 194C -- Payment to contractors
        * `194H` - 194H -- Commission or brokerage
        * `194I` - 194I -- Rent
        * `194J` - 194J -- Professional or technical fees
        * `194Q` - 194Q -- Purchase of goods
    TdsSummary:
      type: object
      properties:
        months:
          type: array
          items:
            $ref: '#/components/schemas/TdsMonth'
        payments_without_challan:
          type: array
          items:
            $ref: '#/components/schemas/TdsPayment'
      required:
      - months
      - payments_without_challan
    TeamClient:
      type: object
      properties:
        unresolved:
          type: integer
          description: Rows nobody has placed in a ledger yet.
        pending_approval:
          type: integer
          description: Rows placed but not yet posted.
        books_to_send:
          type: boolean
          description: 'True when every row is placed and posted, nothing is already
            waiting for a senior, and there are entries newer than the last sign-off:
            the books can be sent for review now.'
        id:
          type: string
          format: uuid
        name:
          type: string
        lead:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
        team:
          type: array
          items:
            $ref: '#/components/schemas/AssignedPerson'
      required:
      - books_to_send
      - id
      - lead
      - name
      - pending_approval
      - team
      - unresolved
    TeamClientsCan:
      type: object
      properties:
        set_lead:
          type: boolean
      required:
      - set_lead
    TeamClientsResponse:
      type: object
      properties:
        can:
          $ref: '#/components/schemas/TeamClientsCan'
        assignable:
          type: array
          items:
            $ref: '#/components/schemas/Person'
          description: Who the person asking may put on a client.
        results:
          type: array
          items:
            $ref: '#/components/schemas/TeamClient'
      required:
      - assignable
      - can
      - results
    TeamEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: One of the `kind` values in the table on `detail`.
        kind_display:
          type: string
        detail:
          $ref: '#/components/schemas/TeamEventDetail'
        member_id:
          type: string
          format: uuid
          nullable: true
        client_id:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time
      required:
      - at
      - client_id
      - detail
      - id
      - kind
      - kind_display
      - member_id
    TeamEventDetail:
      type: object
      description: |-
        What a team event records. Names are as they were then; which keys appear depends on `kind`.

        | kind | keys |
        |---|---|
        | member.invited | actor, email, role, to (the manager, or empty) |
        | member.joined | actor, member, role |
        | invite.revoked | actor, email |
        | member.role_changed | actor, member, from, to |
        | member.manager_changed | actor, member, from, to, removed_from_clients |
        | member.scope_changed | actor, member, to (`on` or `off`) |
        | member.deactivated, member.reactivated | actor, member |
        | member.removed | actor, member, role |
        | client.lead_changed | actor, client, from, to |
        | client.assigned, client.unassigned | actor, member, client |
        | firm.owner_changed | actor, member, from, to |
        | firm.renamed | actor, from, to |

        `actor` is "AutoCA platform" for a change made by the platform owner.
      properties:
        actor:
          type: string
        member:
          type: string
        client:
          type: string
        email:
          type: string
        role:
          type: string
        to:
          type: string
        removed_from_clients:
          type: integer
        from:
          type: string
    TeamEventsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TeamEvent'
          description: The latest 200, newest first.
      required:
      - results
    TreatmentRequest:
      type: object
      description: |-
        One complete accounting decision: where it goes, who it was with, and its tax.

        All four together, because they are decided together and learned together.
        A rule that remembered the ledger and forgot the reverse-charge flag would
        look like it worked until a return was prepared from incomplete books.
      properties:
        ledger:
          type: string
          format: uuid
          description: Ledger account id.
        party:
          type: string
          format: uuid
          nullable: true
          description: Party id, where there is an identifiable one.
        rcm:
          type: boolean
          default: false
          description: 'Reverse charge: the client pays the GST rather than the party.'
        tds_section:
          default: ''
          description: |-
            TDS section, if the payment type crosses its threshold.

            * `192` - 192 -- Salary
            * `194A` - 194A -- Interest other than securities
            * `194C` - 194C -- Payment to contractors
            * `194H` - 194H -- Commission or brokerage
            * `194I` - 194I -- Rent
            * `194J` - 194J -- Professional or technical fees
            * `194Q` - 194Q -- Purchase of goods
          oneOf:
          - $ref: '#/components/schemas/TdsSectionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        learn:
          type: boolean
          default: true
          description: Teach a rule from this decision so the same payee is placed
            automatically from now on. Set false for a genuine one-off.
      required:
      - ledger
    TrialBalance:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
        total_debit_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        total_credit_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        balances:
          type: boolean
          description: False means something reached the books without going through
            a voucher.
        footer:
          $ref: '#/components/schemas/ReportFooter'
        total_debit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        total_credit_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - balances
      - footer
      - rows
      - total_credit_display
      - total_credit_paise
      - total_debit_display
      - total_debit_paise
    TypeEnum:
      enum:
      - bill
      - entry
      - party
      - invoice
      type: string
      description: |-
        * `bill` - bill
        * `entry` - entry
        * `party` - party
        * `invoice` - invoice
    UploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        mapping:
          type: string
          description: 'Optional JSON mapping a field to a header, e.g. {"gstin":
            "Vendor GST"}.'
      required:
      - file
    UploadResult:
      type: object
      properties:
        rows:
          type: integer
          description: Rows read from the file; they replace any earlier upload.
        run:
          $ref: '#/components/schemas/RunReport'
      required:
      - rows
      - run
    VoucherTypeEnum:
      enum:
      - Payment
      - Receipt
      - Contra
      - Journal
      - Purchase
      - Sales
      - Debit Note
      - Credit Note
      type: string
      description: |-
        * `Payment` - Payment
        * `Receipt` - Receipt
        * `Contra` - Contra
        * `Journal` - Journal
        * `Purchase` - Purchase
        * `Sales` - Sales
        * `Debit Note` - Debit Note
        * `Credit Note` - Credit Note
    WantedPartyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          allOf:
          - $ref: '#/components/schemas/Role2a3Enum'
          default: VENDOR
      required:
      - name
    WithdrawRequest:
      type: object
      properties:
        item_key:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - item_key
    WorkTotals:
      type: object
      description: Counts of work in the period, one per metric in `metrics`. Keys
        are the metric keys.
      properties:
        statements_uploaded:
          type: integer
        rows_placed:
          type: integer
        entries_approved:
          type: integer
          description: First-time approvals, not corrections.
        entries_corrected:
          type: integer
        entries_posted:
          type: integer
          description: 'Entries carrying this person''s name: approvals and corrections
            together. Entries the assistant posted by itself are counted for nobody.'
        books_sent_for_review:
          type: integer
          description: Times this person asked a senior to sign a client's books off.
        ledgers_created:
          type: integer
        rules_written:
          type: integer
        proposals_decided:
          type: integer
        model_runs:
          type: integer
      required:
      - books_sent_for_review
      - entries_approved
      - entries_corrected
      - entries_posted
      - ledgers_created
      - model_runs
      - proposals_decided
      - rows_placed
      - rules_written
      - statements_uploaded
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: session
  description: Who is signed in and what they may do.
- name: clients
  description: The firm's clients.
- name: statements
  description: Uploading statements and reading their rows.
- name: review
  description: The review queue and the decisions made against it.
- name: ledger
  description: Approval, the permanent journal, and corrections.
- name: reports
  description: Trial balance, P&L, balance sheet, reconciliation.
- name: jobs
  description: Progress on work the API did not block for.
