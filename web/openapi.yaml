  /api/v1/journal-entries/:
    get:
      operationId: journal_entries_list
      description: |-
        The permanent record.

        Read-only over HTTP, and read-only in PostgreSQL too -- the journal tables
        carry no UPDATE or DELETE grant and triggers that raise. Entries are created
        by approval, never by a POST to a collection: there is a permission to check
        and a voucher number to allocate under a lock.
      parameters:
      - in: query
        name: client
        schema:
          type: string
        description: Filter to one client.
      - in: query
        name: live
        schema:
          type: string
          enum:
          - 'true'
        description: Only entries that have not been corrected. A superseded entry
          stays in the record permanently, so it is included by default.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - ledger
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalEntryList'
          description: ''
