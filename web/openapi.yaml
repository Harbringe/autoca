components:
  schemas:
    AcceptProposalRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Rename the ledger as it is accepted, e.g. to the spelling the
            client already uses.
          maxLength: 255
        group:
          $ref: '#/components/schemas/LedgerGroupEnum'
    AccountSideEnum:
      enum:
      - DR
      - CR
      type: string
      description: |-
        * `DR` - DR
        * `CR` - CR
    Allocation:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AllocationKindEnum'
          readOnly: true
        kind_display:
          type: string
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
        line:
          type: string
          format: uuid
          readOnly: true
        entry_no:
          type: integer
          readOnly: true
        voucher_type:
          type: string
          readOnly: true
        entry_date:
          type: string
          format: date
          readOnly: true
        amount_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - amount_display
      - amount_paise
      - entry_date
      - entry_no
      - id
      - kind
      - kind_display
      - line
      - voucher_type
    AllocationKindEnum:
      enum:
      - AGAINST_BILL
      - ON_ACCOUNT
      - ADVANCE
      type: string
      description: |-
        * `AGAINST_BILL` - Against a bill
        * `ON_ACCOUNT` - On account
        * `ADVANCE` - Advance
    ApproveRequest:
      type: object
      description: |-
        Post reviewed rows to the immutable journal.

        Either an explicit list of classification ids, or a whole confidence band --
        the latter is the one-click bulk approval the review screen offers for
        everything the system is sure about.
      properties:
        classifications:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5000
        band:
          $ref: '#/components/schemas/BandEnum'
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/RowSettlementRequest'
          description: 'For each row placed on a supplier''s or customer''s own account:
            which of the party''s bills it pays, or whether it is held on account
            or as an advance. Such a row is refused without one, and is never approved
            as part of a whole band.'
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ledger:
          type: string
          format: uuid
        ledger_name:
          type: string
        bill:
          type: string
          format: uuid
          nullable: true
        cost_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        cost_display:
          type: string
        residual_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        put_to_use:
          type: string
          format: date
        method:
          type: string
        method_display:
          type: string
        life_years:
          type: integer
        rate_bp:
          type: integer
        disposed_on:
          type: string
          format: date
          nullable: true
        disposal_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          nullable: true
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
      required:
      - bill
      - cost_display
      - cost_paise
      - disposal_paise
      - disposed_on
      - id
      - ledger
      - ledger_name
      - life_years
      - method
      - method_display
      - name
      - put_to_use
      - rate_bp
      - residual_paise
    AssetCreateMethodEnum:
      enum:
      - SLM
      - WDV
      - WDV_IT
      type: string
      description: |-
        * `SLM` - Straight line (Companies Act)
        * `WDV` - Written-down value, by days in use (Companies Act)
        * `WDV_IT` - Written-down value, 180-day rule (Income-tax)
    AssetCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ledger:
          type: string
          format: uuid
          description: A ledger under Fixed Assets.
        bill:
          type: string
          format: uuid
          nullable: true
          description: The purchase it was bought on. The cost cannot exceed what
            that purchase put on the ledger.
        cost_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: 1
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        residual_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: 0
          format: int64
          default: 0
          description: What it is worth at the end of its life.
        put_to_use:
          type: string
          format: date
        method:
          $ref: '#/components/schemas/AssetCreateMethodEnum'
        life_years:
          type: integer
          maximum: 100
          minimum: 0
          default: 0
          description: Straight line only.
        rate_bp:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          description: 'Written-down value only: 1500 is 15%.'
      required:
      - cost_paise
      - ledger
      - method
      - name
      - put_to_use
    AssetRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        ledger:
          type: string
          format: uuid
        ledger_name:
          type: string
          minLength: 1
        bill:
          type: string
          format: uuid
          nullable: true
        cost_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        cost_display:
          type: string
          minLength: 1
        residual_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        put_to_use:
          type: string
          format: date
        method:
          type: string
          minLength: 1
        method_display:
          type: string
          minLength: 1
        life_years:
          type: integer
        rate_bp:
          type: integer
        disposed_on:
          type: string
          format: date
          nullable: true
        disposal_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          nullable: true
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
      required:
      - bill
      - cost_display
      - cost_paise
      - disposal_paise
      - disposed_on
      - id
      - ledger
      - ledger_name
      - life_years
      - method
      - method_display
      - name
      - put_to_use
      - rate_bp
      - residual_paise
    AssignRequest:
      type: object
      properties:
        member:
          type: string
          format: uuid
      required:
      - member
    Assigned:
      type: object
      properties:
        assigned:
          $ref: '#/components/schemas/Person'
      required:
      - assigned
    AssignedPerson:
      type: object
      description: |-
        A member of the firm, as named beside a client or in a list.

        The owner appears like anyone else, to every role that can see the team. Only the owner
        can change the owner (by transferring ownership); anyone else gets 403.
      properties:
        id:
          type: string
          description: The membership id.
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role170Enum'
        role_display:
          type: string
        is_owner:
          type: boolean
        is_active:
          type: boolean
        assigned_at:
          type: string
          format: date-time
        on_my_team:
          type: boolean
          description: Reports directly to the person asking.
      required:
      - assigned_at
      - id
      - is_active
      - is_owner
      - name
      - on_my_team
      - role
      - role_display
    AssistantReasonEnum:
      enum:
      - rate_limit
      - daily_limit
      - provider_down
      - assistant_off
      type: string
      description: "* `` - \n* `rate_limit` - rate_limit\n* `daily_limit` - daily_limit\n\
        * `provider_down` - provider_down\n* `assistant_off` - assistant_off"
    AssistantStateEnum:
      enum:
      - working
      - idle
      - paused
      type: string
      description: |-
        * `working` - working
        * `idle` - idle
        * `paused` - paused
    AttachRequest:
      type: object
      properties:
        bill:
          type: string
          format: uuid
          description: The bill, booked by hand earlier, that this file is the invoice
            for.
      required:
      - bill
    AttentionReason:
      type: object
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/AttentionReasonCodeEnum'
          description: |-
            reconciliation_difference: the books and the bank statement disagree at the latest statement date. statement_month_missing: a month inside a bank account's run of statements has none. assistant_entries_unchecked: entries the assistant posted or changed are not yet checked. unsigned_too_long: the books are not signed off more than 45 days after the latest entry. suspense_balance: the Suspense ledger holds a non-zero balance. opening_balance_unconfirmed: a bank account's opening balance is not confirmed. These describe where the books stand now, whatever period was asked for.

            * `reconciliation_difference` - reconciliation_difference
            * `statement_month_missing` - statement_month_missing
            * `assistant_entries_unchecked` - assistant_entries_unchecked
            * `unsigned_too_long` - unsigned_too_long
            * `suspense_balance` - suspense_balance
            * `opening_balance_unconfirmed` - opening_balance_unconfirmed
        message:
          type: string
          description: A plain sentence; show it as it is.
      required:
      - code
      - message
    AttentionReasonCodeEnum:
      enum:
      - reconciliation_difference
      - statement_month_missing
      - assistant_entries_unchecked
      - unsigned_too_long
      - suspense_balance
      - opening_balance_unconfirmed
      type: string
      description: |-
        * `reconciliation_difference` - reconciliation_difference
        * `statement_month_missing` - statement_month_missing
        * `assistant_entries_unchecked` - assistant_entries_unchecked
        * `unsigned_too_long` - unsigned_too_long
        * `suspense_balance` - suspense_balance
        * `opening_balance_unconfirmed` - opening_balance_unconfirmed
    BalanceCheck:
      type: object
      description: |-
        Month end: does the ledger agree with the bank?

        The check that catches what every other one misses -- a row posted twice, a
        correction reversed the wrong way, an entry approved against the wrong
        account -- in one subtraction.
      properties:
        as_of:
          type: string
          format: date
        ledger_balance_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: What the client's books say.
        statement_balance_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: What the bank's own statement says.
        difference_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        matches:
          type: boolean
        can_close:
          type: boolean
          description: Reconciles *and* nothing up to that date is still unposted.
        unapproved_count:
          type: integer
        explanation:
          type: string
          readOnly: true
        ledger_balance_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        statement_balance_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
        difference_display:
          type: string
          nullable: true
          readOnly: true
          description: The amount with Indian digit grouping, e.g. ₹6,03,490.57.
      required:
      - as_of
      - can_close
      - difference_display
      - difference_paise
      - explanation
      - ledger_balance_display
      - ledger_balance_paise
      - matches
      - statement_balance_display
      - statement_balance_paise
      - unapproved_count
    BalanceSheet:
      type: object
      description: Adds a ``*_display`` string beside every ``*_paise`` field named
        in ``money``.
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
        liabilities:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
        unclassified:
          type: array
          items:
            $ref: '#/components/schemas/LedgerBalance'
          description: Ledgers whose group belongs on neither side of the sheet. They
            are in neither total, so `balances` is false while any exist; place them
            in a known group.
        unclassified_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Net of the unclassified ledgers. Zero when there are none.
        total_assets_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        total_liabilities_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Whole paise, as an exact integer. 53000 means ₹530.00. Never
            a decimal.
        total_liabilities_and_profit_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
          description: Liabilities plus the year's profit (or minus its loss). Equals
            total assets when the sheet balances.
        net_profit_paise:
          type: integer
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          format: int64
